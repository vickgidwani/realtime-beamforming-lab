<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">Exercise 1 timing scopes</title>
<desc id="desc">Four swimlanes show NumPy and CuPy cold and warm paths. Cold timers include setup and one ensemble. Warm pipeline timers start at per-ensemble input handling. Both include beamforming, Power Doppler reduction, and host output. RF-to-IQ is a separate CPU measurement.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#52606d"/>
  </marker>
</defs>
<rect width="1440" height="760" fill="#ffffff"/>
<text x="720" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263442">What the cold and warm timers include</text>
<text x="720" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#52606d">Conceptual timing diagram · stage widths are not proportional to duration</text>

<g font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#263442">
  <text x="24" y="181">NumPy · cold</text>
  <text x="24" y="326">CuPy · cold</text>
  <text x="24" y="501">NumPy · warm</text>
  <text x="24" y="646">CuPy · warm</text>
</g>

