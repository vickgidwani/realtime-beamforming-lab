  <text x="1150" y="639"><tspan x="1150">Copy reduced map</tspan><tspan x="1150" dy="17">to host</tspan></text>
</g>

<text x="720" y="728" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#52606d">The shared CPU RF-to-IQ p50 is measured separately; it is not included in either timer. Dashed boxes show prepared state outside the warm timer.</text>
</svg>
