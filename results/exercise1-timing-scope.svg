  <text x="710" y="261" text-anchor="middle">cold setup + first ensemble wall timer</text>
  <text x="820" y="436" text-anchor="middle">one ensemble_pipeline_wall_ms sample</text>
  <text x="820" y="581" text-anchor="middle">one ensemble_pipeline_wall_ms sample</text>
</g>

