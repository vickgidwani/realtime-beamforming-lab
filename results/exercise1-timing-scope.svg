<g font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#263442">
  <text x="270" y="174"><tspan x="270">Host geometry selected</tspan><tspan x="270" dy="17">(no GPU copy in setup)</tspan></text>
  <text x="490" y="174"><tspan x="490">IQ + geometry staged</tspan><tspan x="490" dy="17">inside mach each call</tspan></text>
  <text x="710" y="174"><tspan x="710">CUDA beamform</tspan><tspan x="710" dy="17">output returns to host</tspan></text>
  <text x="930" y="174"><tspan x="930">Power Doppler</tspan><tspan x="930" dy="17">reduction on CPU</tspan></text>
  <text x="1150" y="174"><tspan x="1150">Power map ready</tspan><tspan x="1150" dy="17">on host</tspan></text>

  <text x="270" y="319"><tspan x="270">Copy static geometry</tspan><tspan x="270" dy="17">+ first CUDA use</tspan></text>
  <text x="490" y="319"><tspan x="490">Upload IQ</tspan><tspan x="490" dy="17">once per ensemble</tspan></text>
  <text x="710" y="319"><tspan x="710">CUDA beamform</tspan><tspan x="710" dy="17">result stays on GPU</tspan></text>
  <text x="930" y="319"><tspan x="930">Power Doppler</tspan><tspan x="930" dy="17">reduction on GPU</tspan></text>
  <text x="1150" y="319"><tspan x="1150">Copy reduced map</tspan><tspan x="1150" dy="17">to host</tspan></text>

  <text x="270" y="494"><tspan x="270">Geometry remains</tspan><tspan x="270" dy="17">on host (outside timer)</tspan></text>
  <text x="490" y="494"><tspan x="490">IQ + geometry staged</tspan><tspan x="490" dy="17">inside mach each call</tspan></text>
  <text x="710" y="494"><tspan x="710">CUDA beamform</tspan><tspan x="710" dy="17">output returns to host</tspan></text>
  <text x="930" y="494"><tspan x="930">Power Doppler</tspan><tspan x="930" dy="17">reduction on CPU</tspan></text>
  <text x="1150" y="494"><tspan x="1150">Power map ready</tspan><tspan x="1150" dy="17">on host</tspan></text>

  <text x="270" y="639"><tspan x="270">Geometry already</tspan><tspan x="270" dy="17">resident on GPU</tspan></text>
  <text x="490" y="639"><tspan x="490">Upload IQ</tspan><tspan x="490" dy="17">once per ensemble</tspan></text>
  <text x="710" y="639"><tspan x="710">CUDA beamform</tspan><tspan x="710" dy="17">result stays on GPU</tspan></text>
