[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-beamforming-lab"
version = "0.1.0"
description = "Raw-RF ultrasound beamforming and latency practice with mach"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
gpu = [
  "mach-beamform[examples,uff,vis]>=0.2.1,<0.3.0",
  "tqdm>=4.65",
  "cupy-cuda12x>=14.0",
]
gpu-colab = [
  "mach-beamform[examples,uff,vis]>=0.2.1,<0.3.0",
  "tqdm>=4.65",
  "cupy-cuda13x>=13.0",
]

[project.scripts]
beamform-lab = "beamforming_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
